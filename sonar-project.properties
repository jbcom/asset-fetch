sonar.organization=jbcom
sonar.projectKey=jbcom_asset-fetch
sonar.projectName=asset-fetch
sonar.sources=src
sonar.tests=tests
sonar.exclusions=dist/**,docs/**,examples/**
sonar.test.inclusions=tests/**/*.test.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Compatibility and caller-owned tools: see docs/ARCHITECTURE.md.
# Keep these exceptions scoped to the specific rule and implementation file.
sonar.issue.ignore.multicriteria=itchChecksum,archiveTools,audioTool
sonar.issue.ignore.multicriteria.itchChecksum.ruleKey=typescript:S4790
sonar.issue.ignore.multicriteria.itchChecksum.resourceKey=src/integrity.ts
sonar.issue.ignore.multicriteria.archiveTools.ruleKey=typescript:S4036
sonar.issue.ignore.multicriteria.archiveTools.resourceKey=src/fetch.ts
sonar.issue.ignore.multicriteria.audioTool.ruleKey=typescript:S4036
sonar.issue.ignore.multicriteria.audioTool.resourceKey=src/promote.ts
