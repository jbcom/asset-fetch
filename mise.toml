# Local development only. CI installs Node/pnpm with the official
# actions/setup-node + pnpm/action-setup (see .github/workflows/*.yml), which
# read the pnpm version straight from package.json#packageManager.
# `mise install` gives a contributor's machine the same default toolchain
# without needing corepack.
[tools]
node = "26"
pnpm = "12"
