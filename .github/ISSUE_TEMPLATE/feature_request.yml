name: Feature request
description: Propose a focused addition that fits asset-fetch's scope.
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What asset discovery, download, extraction or curation problem cannot be solved cleanly with the current API?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API or behavior
      description: Show a small usage example and explain why it belongs here rather than in a project's own script.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe current workarounds and compatibility implications, including anything that touches the trust boundary (URLs, archive paths, credentials).
    validations:
      required: true
