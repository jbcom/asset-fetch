name: Bug report
description: Report reproducible incorrect behavior in asset-fetch.
title: "fix: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: For security vulnerabilities, use the private reporting link in SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the exact command or the smallest runnable code sample, and which source (itch.io, local catalog, Poly Haven) it touches. Never paste an API key.
      render: ts
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: asset-fetch, Node.js, package manager, and operating system.
      placeholder: asset-fetch 0.2.0; Node 24; pnpm 12; macOS 26
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add stack traces, warnings printed by the CLI, or other useful details.
